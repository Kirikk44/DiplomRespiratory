experiment_name: "m1_tiny_2block"
paths:
  keypoints_dir: "keypoints/yolov8n-pose"
  results_dir:   "runs"

data:
  test_subjects: ["S002","S003","S004","S005","S006"]
  use_hf:        true
  val_split:     0.15
  max_frames:    50
  in_channels:   3

augmentation:
  noise_std:          0.02
  joint_dropout:      true
  joint_dropout_prob: 0.08
  temporal_crop:      true
  temporal_speed:     true
  speed_range:        [0.8, 1.2]
  rotate_2d:          true
  rotate_range:       [-10, 10]
  perspective_x:      true
  perspective_x_range: [-0.10, 0.10]
  perspective_y:      false
  zoom:               true
  zoom_range:         [0.88, 1.12]
  translate:          true
  translate_std:      0.04
  horizontal_flip:    false
  scale_bones:        false
  conf_noise:         false

model:
  num_joints:      17
  hidden_channels: [32, 64]      # 2 блока — минимальная модель
  dropout:         0.3
  tcn_kernel_size: 9
  stride_at:       []

training:
  batch_size:               16
  num_epochs:               60
  learning_rate:            0.001
  weight_decay:             0.0001
  scheduler:                "cosine"
  grad_clip:                1.0
  early_stopping_patience:  15

gpu:
  gpu_id:      0
  num_workers: 0
  pin_memory:  true
tensorboard:
  log_histograms: false
  cm_every_n:     10
