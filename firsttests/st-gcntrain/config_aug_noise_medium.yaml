experiment_name: "a21_config_attention_spatio"
paths:
  keypoints_dir: "../keypoints/yolov8n-pose"
  results_dir:   "runs"
data:
  test_subjects:  ["S002", "S003", "S004", "S005", "S006"]
  use_hf:         true        # использовать _HF (горизонтальный флип) файлы
  val_split:      0.15        # доля val от train_all
  max_frames:     50          # длина последовательности (кадры)
  in_channels:    3           # 2 = (x,y) | 3 = (x,y,conf)
  augment_copies: 0           # 0 = on-the-fly | N = датасет ×(N+1) через ConcatDataset

# Только шумовые аугментации — без геометрии и времени
augmentation:
  noise_std:          0.03
  joint_dropout:      true
  joint_dropout_prob: 0.10
  conf_noise:         true
  conf_noise_std:     0.08
  temporal_crop:      false
  temporal_speed:     false
  speed_range:        [1.0, 1.0]
  rotate_2d:          false
  perspective_x:      false
  perspective_y:      false
  zoom:               false
  translate:          false
  horizontal_flip:    false
  scale_bones:        false

model:
  num_joints:      17
  hidden_channels: [64, 64, 128, 128, 256]
  dropout:         0.5
  tcn_kernel_size: 9
  stride_at:       [3]
  use_st_attention:    true
  att_from_block:      1        # с какого блока включать (1 = все блоки)
  att_reduction:       16       # коэф. сжатия в attention MLP (channels // 16)
training:
  batch_size: 16
  num_epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler:                "cosine"
  scheduler_step:           20     # для step scheduler: каждые N эпох
  scheduler_gamma:          0.5    # для step scheduler: множитель LR
  grad_clip: 1.0
  early_stopping_patience: 15
  grad_clip:                1.0    # 0.0 = выкл
  early_stopping_patience:  15     # -1 = выкл
gpu:
  gpu_id: 0
  num_workers: 0
  pin_memory: true
tensorboard:
  log_histograms: false
  cm_every_n: 10
