experiment_name: "a01_no_aug"
paths:
  keypoints_dir: "../keypoints/yolov8n-pose"
  results_dir:   "runs"
data:
  test_subjects: ["S002","S003","S004","S005","S006"]
  use_hf: true
  val_split: 0.15
  max_frames: 50
  in_channels: 3

# Базовая точка отсчёта — полностью без аугментации
augmentation:
  noise_std:          0.0
  joint_dropout:      false
  joint_dropout_prob: 0.0
  temporal_crop:      false
  temporal_speed:     false
  speed_range:        [1.0, 1.0]
  rotate_2d:          false
  rotate_range:       [0, 0]
  perspective_x:      false
  perspective_x_range: [0.0, 0.0]
  perspective_y:      false
  perspective_y_range: [0.0, 0.0]
  zoom:               false
  zoom_range:         [1.0, 1.0]
  translate:          false
  translate_std:      0.0
  horizontal_flip:    false
  scale_bones:        false
  conf_noise:         false

model:
  num_joints:      17
  hidden_channels: [64, 64, 128, 128, 256]
  dropout:         0.5
  tcn_kernel_size: 9
  stride_at:       [3]
training:
  batch_size: 16
  num_epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: "cosine"
  grad_clip: 1.0
  early_stopping_patience: 15
gpu:
  gpu_id: 0
  num_workers: 0
  pin_memory: true
tensorboard:
  log_histograms: false
  cm_every_n: 10
